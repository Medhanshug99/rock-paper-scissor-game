<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissor Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="favicon.webp">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="scores">
            <p>Computer : <span id="computer_score">0</span></p>
            <p>You : <span id="user_score">0</span></p>
        </div>

        <button id="start_btn">Start Game</button>

        <div class="weapons">
            <button data-choice="rock">
                <i class="fa-regular fa-hand-rock"></i>
            </button>
            <button data-choice="paper">
                <i class="fa-regular fa-hand-paper"></i>
            </button>
            <button data-choice="scissor">
                <i class="fa-regular fa-hand-scissors"></i>
            </button>
        </div>

        <div class="details">
            <p id="user_choice"></p>
            <p id="comp_choice"></p>
            <p id="result"></p>
        </div>

        <button id="reset_btn">Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
